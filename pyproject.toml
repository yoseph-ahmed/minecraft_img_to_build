[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcbuilder"
version = "0.1.0"
description = "Build PNG images as Minecraft murals by driving the Java client"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10.0", "mss>=9.0"]

[project.scripts]
mcbuilder = "mcbuilder.cli:main"

[tool.setuptools.packages.find]
include = ["mcbuilder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
