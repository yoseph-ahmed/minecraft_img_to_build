name: build-exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Not the newest release on purpose: the build only needs a version
          # every dependency already ships wheels for, so nothing has to be
          # compiled on the runner.
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pyinstaller

      - name: Test
        run: python -m pytest -q

      - name: Build
        working-directory: packaging
        run: python -m PyInstaller --clean --noconfirm mcbuilder.spec

      - name: Smoke test the executable
        # A green test suite says nothing about whether the bundle resolves
        # its imports on a machine without Python, so the built .exe has to
        # actually run. `plan` is the deepest command that needs no game and
        # no screen: it exercises numpy and Pillow for real, which are the
        # dependencies most likely to be mis-bundled.
        run: |
          $exe = ".\packaging\dist\mcbuilder.exe"

          python -c "from PIL import Image; Image.new('RGB', (32, 32), (200, 40, 40)).save('smoke.png')"

          $out = & $exe blocks 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "blocks failed with $LASTEXITCODE" }
          if ($out -notmatch 'blocks available') { throw "unexpected blocks output:`n$out" }

          $out = & $exe plan smoke.png --width 16 -x 0 -y 64 -z 0 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "plan failed with $LASTEXITCODE" }
          if ($out -notmatch 'hotbar:') { throw "unexpected plan output:`n$out" }
          Write-Host $out

          # Running with arguments must not stop for input; that prompt is
          # only for a double-clicked window.
          if ($out -match 'Press Enter') { throw "the .exe paused despite being run from a shell" }

      - uses: actions/upload-artifact@v4
        with:
          name: mcbuilder-windows
          path: packaging/dist/mcbuilder.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            packaging/dist/mcbuilder.exe `
            --title "mcbuilder $env:GITHUB_REF_NAME" `
            --notes "Download ``mcbuilder.exe`` and run it. No Python needed.

          Windows SmartScreen will warn about an unsigned download: choose
          **More info** then **Run anyway**.

          Double-click for a guided menu, or run it from a terminal for the
          full command line (``mcbuilder.exe --help``)."
